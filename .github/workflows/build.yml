name: OrangeFox - Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: '12.1'
        type: choice
        options:
          - '14.1'
          - '12.1'
          - '11.0'
      DEVICE_TREE:
        description: 'OrangeFox Device Tree'
        required: true
        default: 'https://github.com/secr5t/device_oppo_CPH2269/'
      DEVICE_TREE_BRANCH:
        description: 'OrangeFox Device Tree Branch'
        required: true
        default: 'fox-12.1'
      DEVICE_PATH:
        description: 'Device Tree Path'
        required: true
        default: 'device/oppo/CPH2269'
      DEVICE_NAME:
        description: 'Device Codename'
        required: true
        default: 'CPH2269'
      MAKEFILE_NAME:
        description: 'Makefile Name (excluding .mk extension, Example: twrp_codename)'
        required: true
        default: 'twrp_CPH2269'
      BUILD_TARGET:
        description: 'Build Target'
        required: true
        default: 'recovery'
        type: choice
        options:
          - 'boot'
          - 'recovery'
          - 'vendorboot'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Set Build Start and Date
        run: |
          echo "BUILD_START=$(date +%s)" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date +'%Y%m%d-%H%M')" >> $GITHUB_ENV
          echo "BUILD_DATE_PRETTY=$(date -u +'%d %b %Y')" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4
                  
      - name: Clean-up
        uses: rokibhasansagar/slimhub_actions@main

      - name: Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24
        
      - name: Build Environment
        run: |
          sudo apt-get update && sudo apt-get install -y aria2 git jq curl
          git clone https://gitlab.com/OrangeFox/misc/scripts.git -b master
          cd scripts
          sudo bash setup/android_build_env.sh

      - name: Set-up Manifest
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/OrangeFox"
          cd "${GITHUB_WORKSPACE}/OrangeFox"
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git clone https://gitlab.com/OrangeFox/sync.git -b master
          cd sync
          ./orangefox_sync.sh --branch "${{ inputs.MANIFEST_BRANCH }}" --path "${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}"

      - name: Clone Device Tree
        run: |
          cd "${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}"
          git clone "${{ inputs.DEVICE_TREE }}" -b "${{ inputs.DEVICE_TREE_BRANCH }}" "./${{ inputs.DEVICE_PATH }}"
          cd "./${{ inputs.DEVICE_PATH }}"
          
          echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "SHORT_COMMIT_ID=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "COMMIT_TITLE=$(git log -1 --pretty=%s)" >> $GITHUB_ENV
          echo "COMMIT_DATE=$(git log -1 --date=format:%Y-%m-%d --pretty=%cd)" >> $GITHUB_ENV

      - name: Get OrangeFox Recovery Commit
        run: |
          cd "${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/bootable/recovery"

          echo "OF_COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "OF_SHORT_COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "OF_COMMIT_TITLE=$(git log -1 --pretty=%s)" >> $GITHUB_ENV
          echo "OF_COMMIT_DATE=$(git log -1 --date=format:%Y-%m-%d --pretty=%cd)" >> $GITHUB_ENV

      - name: Building OrangeFox
        run: |
          cd "${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}"
          
          set +e
          source build/envsetup.sh
          set -e
          
          export ALLOW_MISSING_DEPENDENCIES=true
          
          if [ "${{ inputs.MANIFEST_BRANCH }}" = "14.1" ]; then
            LUNCH_TARGET="${{ inputs.MAKEFILE_NAME }}-ap2a-eng"
          else
            LUNCH_TARGET="${{ inputs.MAKEFILE_NAME }}-eng"
          fi

          lunch "$LUNCH_TARGET" || { echo "Lunch failed"; exit 1; }
          
          make clean
          
          mka adbd "${{ inputs.BUILD_TARGET }}image"

      - name: Rename Build Outputs
        run: |
          cd "${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}"
          
          for f in OrangeFox*.img; do
            [ -e "$f" ] && mv "$f" "${f%.img}-${{ env.BUILD_DATE }}.img"
          done
          
          for f in OrangeFox*.zip; do
            [ -e "$f" ] && mv "$f" "${f%.zip}-${{ env.BUILD_DATE }}.zip"
          done

      - name: Create Release Notes
        run: |
          cat <<EOF > release_notes.md
          OrangeFox Branch: ${{ inputs.MANIFEST_BRANCH }}

          Device: ${{ inputs.DEVICE_NAME }}
          Image Build Target: ${{ inputs.BUILD_TARGET }}
          
          Device Tree Repo: [Device Tree](${{ inputs.DEVICE_TREE }})
          Device Tree Branch: ${{ inputs.DEVICE_TREE_BRANCH }}
          
          OrangeFox Recovery Commit:
          [${{ env.OF_SHORT_COMMIT }}](https://gitlab.com/OrangeFox/bootable/Recovery/-/commit/${{ env.OF_COMMIT_ID }}) - ${{ env.OF_COMMIT_TITLE }} (${{ env.OF_COMMIT_DATE }})

          Device Tree Commit:
          [${{ env.SHORT_COMMIT_ID }}](${{ inputs.DEVICE_TREE }}/commit/${{ env.COMMIT_ID }}) - ${{ env.COMMIT_TITLE }} (${{ env.COMMIT_DATE }})
          EOF

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox*.img
            OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox*.zip
          name: OrangeFox Recovery for ${{ inputs.DEVICE_NAME }} (${{ env.BUILD_DATE }}) (${{ env.SHORT_COMMIT_ID }})
          tag_name: ${{ inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}
          body_path: release_notes.md
          prerelease: true

      - name: Send Notification to Telegram
        run: |
          OUT_DIR="${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}"
          FILE=$(find "$OUT_DIR" -maxdepth 1 -type f -name "OrangeFox*.img" | head -n 1)

          if [ -n "$FILE" ]; then
            FILE_NAME=$(basename "$FILE")
            MD5_VAL=$(md5sum "$FILE" | cut -d ' ' -f 1)
            DIRECT_LINK="https://github.com/${{ github.repository }}/releases/download/${{ inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}/${FILE_NAME}"

            ACTOR_CLEAN=$(echo "${{ github.actor }}" | tr -d '@')

            BUILD_END=$(date +%s)
            DIFF=$((BUILD_END - ${BUILD_START:-BUILD_END}))
            DAYS=$((DIFF / 86400))
            HOURS=$(( (DIFF % 86400) / 3600 ))
            MINS=$(( (DIFF % 3600) / 60 ))
            SECS=$((DIFF % 60))

            BUILD_DURATION=""
            [ $DAYS -gt 0 ] && BUILD_DURATION="${DAYS}d "
            [ $HOURS -gt 0 ] && BUILD_DURATION="${BUILD_DURATION}${HOURS}h "
            [ $MINS -gt 0 ] && BUILD_DURATION="${BUILD_DURATION}${MINS}m "
            BUILD_DURATION="${BUILD_DURATION}${SECS}s"

            CAPTION=$(printf '<b>OrangeFox R%s</b> for OPPO A16\n- <b>Build Type:</b> Unofficial\n- <b>Build Date:</b> %s\n- <b>Build By:</b> <a href="https://github.com/%s">%s</a>\n- <b>Build Time:</b> %s\n\n◾<b>Download:</b> <a href="%s">Here</a>\n\n<b>MD5:</b> <code>%s</code>' \
              "${{ inputs.MANIFEST_BRANCH }}" \
              "${{ env.BUILD_DATE_PRETTY }}" \
              "${ACTOR_CLEAN}" \
              "${ACTOR_CLEAN}" \
              "${BUILD_DURATION}" \
              "${DIRECT_LINK}" \
              "${MD5_VAL}")

            curl -s -X POST "https://api.telegram.org/bot${{ secrets.bot_token }}/sendPhoto" \
                 -d "chat_id=-1004452787333" \
                 -d "photo=https://orangefox.tech/r12.png" \
                 --data-urlencode "caption=${CAPTION}" \
                 -d "parse_mode=HTML"
          fi
